<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Countdown 💚</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <p class="countdown-title">
            Something special is waiting for you... 💚
        </p>

        <div id="countdown">

            <div class="time-box">
                <span id="days">00</span>
                <small>Days</small>
            </div>

            <div class="colon">:</div>

            <div class="time-box">
                <span id="hours">00</span>
                <small>Hours</small>
            </div>

            <div class="colon">:</div>

            <div class="time-box">
                <span id="minutes">00</span>
                <small>Minutes</small>
            </div>

            <div class="colon">:</div>

            <div class="time-box">
                <span id="seconds">00</span>
                <small>Seconds</small>
            </div>

        </div>


        <!-- BEFORE BIRTHDAY -->

        <div id="beforeBirthday">

            <p id="specialDayText">
                You will get to know your password after countdown ends... 😙
            </p>

            <button id="backButton">
                ← Back
            </button>

        </div>


        <!-- AFTER COUNTDOWN -->

        <div id="birthdayMessage" class="hidden">

            <h1>
                Happy birthday Brinda....💚
            </h1>

            <p>
                password is 0826
            </p>

            <div class="password-section">

                <input
                    type="password"
                    id="passwordInput"
                    placeholder="Enter Password"
                >

                <button id="unlockButton">
                    Unlock 🔓
                </button>

                <p id="passwordMessage"></p>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
