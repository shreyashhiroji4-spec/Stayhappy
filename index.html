<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Special for you 💚</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- PAGE 1: OPENING -->
        <section id="intro">

            <p class="intro-text">Welcome My lady...💚</p>

            <p class="intro-text">Finally you're here again...😘</p>

            <p class="intro-text">Is Bespoke for you only...😊</p>

            <button onclick="window.location.href='countdown.html'">
    Tap to Begin... 😎
</button>

        </section>


        <!-- PAGE 2: COUNTDOWN -->
        <section id="countdownSection" class="hidden">

            <p class="countdown-title">
                Something special is waiting for you... 💚
            </p>

            <div id="countdown">

                <div class="time-box">
                    <span id="days">00</span>
                    <small>Days</small>
                </div>

                <div class="colon">:</div>

                <div class="time-box">
                    <span id="hours">00</span>
                    <small>Hours</small>
                </div>

                <div class="colon">:</div>

                <div class="time-box">
                    <span id="minutes">00</span>
                    <small>Minutes</small>
                </div>

                <div class="colon">:</div>

                <div class="time-box">
                    <span id="seconds">00</span>
                    <small>Seconds</small>
                </div>

            </div>

            <p class="bottom-text">
                Until your special day... 🎂
            </p>

        </section>


        <!-- PAGE 3: BIRTHDAY -->
        <section id="birthdayMessage" class="hidden">

            <h1>Happy Birthday, Brinda! 🎂💚</h1>

            <p>Your special surprise is ready...</p>

        </section>

    </div>


    <script src="script.js"></script>

</body>

</html>
