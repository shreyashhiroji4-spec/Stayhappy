<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Special or you (Same one) 💚</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div id="intro">
            <p class="small-text">Welcome My lady...💚</p>

            <h1>Finally you're here agine...😊</h1>

            <p class="date">This is Besopke for you only...😘</p>

            <button id="startButton">Tab to Begin...😎</button>
        </div>


        <div id="countdownSection" class="hidden">

            <p class="message">
                The wait is almost over...
            </p>

            <div id="countdown">

                <div class="time-box">
                    <span id="days">00</span>
                    <small>Days</small>
                </div>

                <div class="colon">:</div>

                <div class="time-box">
                    <span id="hours">00</span>
                    <small>Hours</small>
                </div>

                <div class="colon">:</div>

                <div class="time-box">
                    <span id="minutes">00</span>
                    <small>Minutes</small>
                </div>

                <div class="colon">:</div>

                <div class="time-box">
                    <span id="seconds">00</span>
                    <small>Seconds</small>
                </div>

            </div>

            <p class="bottom-text">
                Something made especially for you 💚
            </p>

        </div>


        <div id="birthdayMessage" class="hidden">

            <h1>Happy Birthday, Brinda! 🎂💚</h1>

            <p>
                Your special surprise is ready...
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
